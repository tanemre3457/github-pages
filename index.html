<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anket Formu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            max-width: 600px;
            background-color: #f4f4f4;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #28a745;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h2>Anket Formu</h2>
    <form id="anketForm">
        <label>Adınız:</label>
        <input type="text" name="Ad" required>

        <label>Soyadınız:</label>
        <input type="text" name="Soyad" required>

        <label>Email:</label>
        <input type="email" name="Email" required>

        <label>Yaş:</label>
        <input type="number" name="Yaş" required>

        <label>Cinsiyet:</label>
        <select name="Cinsiyet">
            <option value="Erkek">Erkek</option>
            <option value="Kadın">Kadın</option>
            <option value="Diğer">Diğer</option>
        </select>

        <button type="submit">Gönder</button>
    </form>

    <script>
        document.getElementById("anketForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const formData = new FormData(this);
            const formObject = Object.fromEntries(formData.entries());

            fetch("YOUR_SCRIPT_DEPLOYMENT_URL", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(formObject)
            })
            .then(response => response.json())
            .then(data => {
                alert("Form başarıyla gönderildi!");
                document.getElementById("anketForm").reset();
            })
            .catch(error => {
                alert("Bir hata oluştu, tekrar deneyin.");
                console.error("Error:", error);
            });
        });
    </script>

</body>
</html>
